; NG4 extra weapon keys.
; [Keys] = trigger key virtual-key codes in decimal, one per slot.
;   Common values: Q=81 E=69 R=82 F=70 T=84 G=71 Z=90 X=88 C=67 V=86 B=66
;                  1..9=49..57 0=48 F1..F8=112..119 Tab=9
;   Both slots must use different keys. Missing section falls back to Q and E.
; [Weapons] = weapon each slot switches to.
; Yakumo: 0=Twin blades, 1=Staff, 2=Lance, 3=Assassin tools,
; 4=Dark Dragon Blade, 6=Solitaire (DLC scythe).
; Only already-unlocked weapons are accepted.
; Save this file to reload automatically (about 1 second).
[Keys]
Key5=81
Key6=69
[Weapons]
Key5=4
Key6=2
[Toolset]
; 面板「六槽武器」开关：1 = 开（游戏一启动就自动注入），0 = 关。面板会写这一行，状态跨重启记住。
WeaponSwitch=1

; 主动存档：只有 [Save] TestKey 这个手动触发键会写盘，F10=121，0 = 关掉（完全不写盘）。
; 没有退出时存档、没有菜单自动存档、没有定时保存。KickMode / Probe 是这条手动存档的诊断开关。
[Save]
TestKey=121
KickMode=5
Probe=0
